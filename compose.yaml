# Local development database only. Credentials are synthetic and must never be reused elsewhere.
# Start: docker compose up -d --wait
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ucc
      POSTGRES_PASSWORD: ucc_local_only
      POSTGRES_DB: ucc_dev
    ports:
      # Non-default host port avoids clashing with a locally installed Postgres.
      - '127.0.0.1:54329:5432'
    volumes:
      - ucc-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ucc -d ucc_dev']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  ucc-postgres:
