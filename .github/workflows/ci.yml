name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  # Clerk development instance. Configure in Settings > Secrets and variables > Actions.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: /auth/sign-in
  NEXT_PUBLIC_CLERK_SIGN_UP_URL: /auth/sign-up
  NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /dashboard/overview
  NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /dashboard/overview
  # Deliberately matches no real account: smoke tests never sign in, and no one is the owner in CI.
  OWNER_CLERK_USER_ID: user_ci_placeholder_no_owner
  # No DSN in CI, so Sentry stays inactive.
  NEXT_PUBLIC_SENTRY_DISABLED: 'true'

jobs:
  verify:
    name: Lint, test, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Disposable database with synthetic credentials; no secrets involved.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ucc
          POSTGRES_PASSWORD: ucc_ci_only
          POSTGRES_DB: ucc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ucc -d ucc_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint:strict

      - name: Typecheck
        run: bun run typecheck

      - name: Contract JSON Schema is current
        run: bun run contracts:check

      - name: Contract tests and fixtures
        run: bun run test:contracts

      - name: Unit tests
        run: bun run test

      - name: Migrations are current with the schema
        run: bun run db:check

      - name: Apply migrations to an empty database
        env:
          DATABASE_URL: postgres://ucc:ucc_ci_only@localhost:5432/ucc_test
        run: bun run db:migrate

      - name: Database integration tests
        env:
          TEST_DATABASE_URL: postgres://ucc:ucc_ci_only@localhost:5432/ucc_test
        run: bun run test:integration

      - name: Check Clerk configuration
        run: |
          missing=()
          [ -z "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ] && missing+=("variable NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY")
          [ -z "$CLERK_SECRET_KEY" ] && missing+=("secret CLERK_SECRET_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Missing GitHub Actions configuration: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Production build
        run: bun run build

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Playwright tests
        env:
          # Fake n8n transport only (set in playwright.config.ts); this database is migrated above.
          DATABASE_URL: postgres://ucc:ucc_ci_only@localhost:5432/ucc_test
          # Optional dedicated Clerk test user. When unset, the signed-in owner flow is skipped.
          E2E_CLERK_USER_ID: ${{ vars.E2E_CLERK_USER_ID }}
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
